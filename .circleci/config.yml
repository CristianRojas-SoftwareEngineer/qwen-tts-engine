# CircleCI de qwen-tts-engine en Linux ARM64, macOS ARM64 y Windows x86_64.
#
# Linux ARM64 enlaza un OpenBLAS propio (scripts/build-openblas.sh, en caché): el de Ubuntu 22.04
# solo trae el kernel genérico ARMV8.
#
# Pruebas (en cada push, salvo en las ejecuciones manuales de medición): clippy -D warnings,
# cargo test --workspace --release (con el modelo Base restaurado de la caché) y --self-test.
#
# Medición (solo a mano, para no gastar créditos en cada push). Parámetros (booleanos):
#   measure       Linux ARM64, macOS ARM64 y Windows x86_64: --caps, --self-test y 3 síntesis
#                 de la frase corta y la larga (scripts/ci-measure-rtf.sh).
#   kernels       Los tres sistemas: QWEN_KERNELS=auto frente a QWEN_KERNELS=scalar, intercalados
#                 (scripts/ci-compare-kernels.sh).
# Lanzamiento: POST https://circleci.com/api/v2/project/gh/CristianRojas-SoftwareEngineer/qwen-tts-engine/pipeline
#   {"branch": "main", "parameters": {"measure": true}}
# (o, en la web de CircleCI, «Trigger Pipeline» con el parámetro correspondiente = true).
version: 2.1

orbs:
  win: circleci/windows@5.0

parameters:
  measure:
    type: boolean
    default: false
    description: Ejecuta la medición en Linux ARM64, macOS ARM64 y Windows x86_64.
  kernels:
    type: boolean
    default: false
    description: Compara QWEN_KERNELS=auto con QWEN_KERNELS=scalar en los tres sistemas.

commands:
  download_model:
    description: Descarga Qwen/Qwen3-TTS-12Hz-0.6B-Base en models/qwen3-tts-0.6b-base (con caché)
    parameters:
      shell:
        type: string
        default: /bin/bash
    steps:
      - restore_cache:
          keys:
            - base-model-v1
      - run:
          name: Descargar el modelo (si no está en caché)
          shell: << parameters.shell >>
          command: |
            set -euo pipefail
            D=models/qwen3-tts-0.6b-base
            HF=https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-Base/resolve/main
            mkdir -p "$D/speech_tokenizer"
            for f in config.json generation_config.json merges.txt model.safetensors preprocessor_config.json \
                     tokenizer_config.json vocab.json speech_tokenizer/config.json speech_tokenizer/configuration.json \
                     speech_tokenizer/model.safetensors speech_tokenizer/preprocessor_config.json; do
              [ -s "$D/$f" ] || curl -fsSL --retry 3 -o "$D/$f" "$HF/$f"
            done
            ls -l "$D" "$D/speech_tokenizer"
      - save_cache:
          key: base-model-v1
          paths:
            - models/qwen3-tts-0.6b-base

  build_own_openblas:
    description: >-
      OpenBLAS estático compilado con scripts/build-openblas.sh (DYNAMIC_ARCH, con caché), enlazado
      con OPENBLAS_LIB_DIR: el kernel de cada CPU ARM no depende del OpenBLAS de la distribución.
    steps:
      - restore_cache:
          keys:
            - openblas-0.3.30-dynarch-arm64-v1
      - run:
          name: OpenBLAS 0.3.30 propio (compilar si no está en caché)
          no_output_timeout: 40m
          command: |
            if [ ! -s "$HOME/openblas/lib/libopenblas.a" ]; then
              bash scripts/build-openblas.sh "$HOME/openblas" 0.3.30
            fi
            echo "export OPENBLAS_LIB_DIR=$HOME/openblas/lib" >> "$BASH_ENV"
      - save_cache:
          key: openblas-0.3.30-dynarch-arm64-v1
          paths:
            - ~/openblas

  install_rust_unix:
    steps:
      - run:
          name: Instalar Rust (versión de rust-toolchain.toml)
          command: |
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            source "$HOME/.cargo/env"
            rustup toolchain install
            rustc -V

  test_unix:
    steps:
      - run:
          name: clippy (-D warnings)
          command: cargo clippy --workspace --all-targets -- -D warnings
      - run:
          name: cargo test --workspace --release
          no_output_timeout: 20m
          command: cargo test --workspace --release
      - run:
          name: --caps y --self-test
          command: |
            cargo build --release -p qwen-app
            ./target/release/qwen_tts --caps
            ./target/release/qwen_tts --self-test

  build_and_measure_unix:
    steps:
      - run:
          name: Compilar qwen_tts (release)
          command: |
            rustc --version
            cargo build --release -p qwen-app
      - run:
          name: Medir (--caps, --self-test, síntesis corta y larga × 3)
          no_output_timeout: 10m
          command: bash scripts/ci-measure-rtf.sh 4 measurement
      - store_artifacts:
          path: measurement

  compare_kernels_unix:
    steps:
      - run:
          name: Compilar qwen_tts (release)
          command: cargo build --release -p qwen-app
      - run:
          name: Comparar kernels (auto frente a scalar)
          no_output_timeout: 15m
          command: bash scripts/ci-compare-kernels.sh kernels
      - store_artifacts:
          path: kernels

  prepare_windows:
    description: MSYS2 UCRT64 (gcc, OpenBLAS), Rust para x86_64-pc-windows-gnu, modelo y compilación
    steps:
      - checkout
      - run:
          name: Instalar MSYS2 UCRT64 (gcc, OpenBLAS, binutils)
          command: |
            $ErrorActionPreference = "Stop"
            choco install msys2 -y --no-progress --params "/NoUpdate /InstallDir:C:\msys64"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --needed --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-binutils"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Instalar Rust (versión de rust-toolchain.toml, x86_64-pc-windows-gnu)
          command: |
            $ErrorActionPreference = "Stop"
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$env:USERPROFILE\.cargo\bin\rustup.exe" toolchain install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - download_model:
          shell: bash.exe
      - run:
          name: Compilar qwen_tts.exe (release, x86_64-pc-windows-gnu)
          shell: bash.exe
          command: |
            export PATH="/c/msys64/ucrt64/bin:$HOME/.cargo/bin:$PATH"
            unset OPENBLAS_NUM_THREADS
            rustc --version
            cargo build --release -p qwen-app --target x86_64-pc-windows-gnu

jobs:
  test-linux-arm64:
    docker:
      - image: cimg/base:current
    resource_class: arm.large
    steps:
      - checkout
      - build_own_openblas
      - install_rust_unix
      - download_model
      - test_unix

  test-macos-arm64:
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - install_rust_unix
      - download_model
      - test_unix

  test-windows-x64:
    executor:
      name: win/server-2022
      size: large
    steps:
      - prepare_windows
      - run:
          name: clippy, cargo test y --self-test (x86_64-pc-windows-gnu)
          shell: bash.exe
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            export PATH="/c/msys64/ucrt64/bin:$HOME/.cargo/bin:$PATH"
            unset OPENBLAS_NUM_THREADS
            cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
            cargo test --workspace --release --target x86_64-pc-windows-gnu
            target/x86_64-pc-windows-gnu/release/qwen_tts.exe --caps
            target/x86_64-pc-windows-gnu/release/qwen_tts.exe --self-test

  measure-linux-arm64:
    docker:
      - image: cimg/base:current
    resource_class: arm.large
    steps:
      - checkout
      - build_own_openblas
      - install_rust_unix
      - download_model
      - build_and_measure_unix

  measure-macos-arm64:
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - install_rust_unix
      - download_model
      - build_and_measure_unix

  measure-windows-x64:
    # `medium` tiene 2 núcleos físicos: el motor se fija a uno por núcleo y, con -j 4 (más los
    # hilos del decoder), sus barreras se estorban y la síntesis no avanza. `large` da 4.
    executor:
      name: win/server-2022
      size: large
    steps:
      - prepare_windows
      - run:
          name: Medir (--caps, --self-test, síntesis corta y larga × 3)
          shell: bash.exe
          no_output_timeout: 10m
          command: |
            export PATH="/c/msys64/ucrt64/bin:$HOME/.cargo/bin:$PATH"
            unset OPENBLAS_NUM_THREADS
            BIN=target/x86_64-pc-windows-gnu/release/qwen_tts.exe bash scripts/ci-measure-rtf.sh 4 measurement
      - store_artifacts:
          path: measurement

  kernels-linux-arm64:
    docker:
      - image: cimg/base:current
    resource_class: arm.large
    steps:
      - checkout
      - build_own_openblas
      - install_rust_unix
      - download_model
      - compare_kernels_unix

  kernels-macos-arm64:
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - install_rust_unix
      - download_model
      - compare_kernels_unix

  kernels-windows-x64:
    executor:
      name: win/server-2022
      size: large
    steps:
      - prepare_windows
      - run:
          name: Comparar kernels (auto frente a scalar)
          shell: bash.exe
          no_output_timeout: 15m
          command: |
            export PATH="/c/msys64/ucrt64/bin:$HOME/.cargo/bin:$PATH"
            unset OPENBLAS_NUM_THREADS
            BIN=target/x86_64-pc-windows-gnu/release/qwen_tts.exe bash scripts/ci-compare-kernels.sh kernels
      - store_artifacts:
          path: kernels

workflows:
  test:
    when:
      and:
        - not: << pipeline.parameters.measure >>
        - not: << pipeline.parameters.kernels >>
    jobs:
      - test-linux-arm64
      - test-macos-arm64
      - test-windows-x64
  measure:
    when: << pipeline.parameters.measure >>
    jobs:
      - measure-linux-arm64
      - measure-macos-arm64
      - measure-windows-x64
  kernels:
    when: << pipeline.parameters.kernels >>
    jobs:
      - kernels-linux-arm64
      - kernels-macos-arm64
      - kernels-windows-x64

# Los temporales de todo lo que lanza Cargo (pruebas, scripts de compilación, herramientas) caen
# en `target`, así que los restos de una ejecución interrumpida quedan donde `cargo clean` los
# retira, igual en los tres sistemas operativos, y nunca en el temporal del sistema.
[env]
TMP = { value = "target", force = true, relative = true }
TEMP = { value = "target", force = true, relative = true }
TMPDIR = { value = "target", force = true, relative = true }

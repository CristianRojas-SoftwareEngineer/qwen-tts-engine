name: CI (qwen-tts-engine)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            os: linux
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            os: linux
          - name: macos-arm64
            runner: macos-latest
            os: macos

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Run workspace unit & kernel tests
        run: cargo test --workspace --release

      - name: Build qwen_tts release binary
        run: cargo build -p qwen-app --release

      - name: Verify --caps and --self-test
        run: |
          ./target/release/qwen_tts --caps
          ./target/release/qwen_tts --self-test

      - name: Check optional pure-Rust faer-blas feature (Linux x86_64)
        if: matrix.name == 'linux-x86_64'
        run: cargo check -p qwen-app --features faer-blas

  test-windows-gnu:
    name: windows-x86_64-gnu
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 + OpenBLAS
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-binutils

      - name: Setup Rust (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Run workspace unit & kernel tests
        shell: pwsh
        env:
          OMP_NUM_THREADS: "4"
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          Remove-Item Env:OPENBLAS_NUM_THREADS -ErrorAction SilentlyContinue
          cargo test --workspace --release --target x86_64-pc-windows-gnu

      - name: Build qwen_tts.exe and verify --caps / --self-test / UTF-8 manifest
        shell: pwsh
        env:
          OMP_NUM_THREADS: "4"
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          Remove-Item Env:OPENBLAS_NUM_THREADS -ErrorAction SilentlyContinue
          cargo build -p qwen-app --release --target x86_64-pc-windows-gnu
          $exe = "target\x86_64-pc-windows-gnu\release\qwen_tts.exe"
          & $exe --caps
          & $exe --self-test
          python -c "d=open(r'$exe','rb').read(); assert b'activeCodePage' in d and b'UTF-8' in d"

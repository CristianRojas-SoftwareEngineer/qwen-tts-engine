[toolchain]
# Versión fija: la CI y los equipos locales compilan con el mismo Rust (lints de clippy y código
# generado iguales, y por tanto el mismo audio). Actualizarla es una decisión explícita.
channel = "1.96.0"
components = ["clippy"]
targets = ["x86_64-pc-windows-gnu"]
profile = "minimal"

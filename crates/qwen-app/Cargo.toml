[package]
name = "qwen-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
faer-blas = ["qwen-kernels/faer-blas"]

[[bin]]
name = "qwen_tts"
path = "src/main.rs"

[dependencies]
qwen-kernels = { path = "../qwen-kernels" }
qwen-core = { path = "../qwen-core" }
qwen-engine = { path = "../qwen-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

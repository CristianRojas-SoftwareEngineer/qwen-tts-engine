[workspace]
resolver = "2"
members = [
    "crates/qwen-kernels",
    "crates/qwen-core",
    "crates/qwen-engine",
    "crates/qwen-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/CristianRojas-SoftwareEngineer/qwen-tts-engine"
description = "Motor de inferencia independiente en Rust para CPU y servidor HTTP para Qwen3-TTS 0.6B"
readme = "README.md"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
